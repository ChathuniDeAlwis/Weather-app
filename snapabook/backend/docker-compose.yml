version: '3.9'
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: snapabook
      MYSQL_USER: snapabook
      MYSQL_PASSWORD: snapabook_pw
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/01_seed.sql:ro
volumes:
  db_data: